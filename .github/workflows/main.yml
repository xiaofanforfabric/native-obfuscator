name: Main pipeline

# ===========================================================================
# 这个工作流只做「推上来的代码还构建得起来吗」的快速校验。
#
# 它和上游 radioegor146/native-obfuscator 的 main.yml 有三处**故意**的差异,
# 因为上游那份配置直接拿到本仓库来跑必定全红:
#
# 1) 矩阵是 [17, 21, 25],不是上游的 [8, 11, 17, 21, 25]。
#    Gradle 9.3.1 要求用 **JVM 17~25** 才能执行 Gradle 本身:
#      "A JVM version between 17 and 25 is required to execute Gradle."
#    https://docs.gradle.org/9.3.1/userguide/compatibility.html
#    同一张兼容表里,JDK 8 和 JDK 11 的 "Support for running Gradle" 只到
#    8.14.x,所以在 wrapper 固定在 9.3.1 的前提下这两项必定在 `./gradlew`
#    启动阶段就失败 —— 不是代码有问题。
#    这不是本仓库特有的现象:上游当前的 CI 正是这样红的。实测 run
#    35110882936(commit b3b3a40),15 个 job 里只有「JDK 11 on ubuntu-latest」
#    真的失败,其余 14 个被 fail-fast 连坐 cancel。
#    历史:本仓库曾把 wrapper 降回 Gradle 8.14.2 以绕开 shadow 插件不兼容
#    问题,从而还能用 JDK 8/11;上游合入 shadow 修复(PR #103)之后这个绕道
#    已无必要,详见 MODIFICATIONS.md 的 v1.4.4。
#
# 2) 只在 ubuntu-latest 上跑。
#    - windows-latest:上游用 VS2019 Enterprise 的 vcvars64.bat 初始化 MSVC,
#      这个路径在现代 runner 上已经不存在(runner 上是 VS2022),必然失败;
#    - macos-latest:runner 按 10 倍计费,而本项目的主要部署环境是 Linux 服务器。
#    哪天需要跨平台验证,把 platform 矩阵加回来即可。
#
# 3) 不跑 `./gradlew test`。
#    测试依赖 krak2(Krakatau,需要 clone 下来 cargo build 好几分钟),每次 push
#    都跑代价太大;发布前的完整校验由 release.yml 负责。
# ===========================================================================

on:
  push:
    branches:
      - '**'
    # 标签由 release.yml 处理,这里不要再触发(否则推标签会跑整套构建矩阵)
    tags-ignore:
      - '**'
  pull_request:

# 同一分支连续 push 时,取消上一次还没跑完的运行
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      # 显式关掉 fail-fast。上游把它开着,任何单个 job 失败都会把其余 job 一起
      # cancel,屏幕上只剩一片红,根本看不出到底有几个 JDK 真的有问题。
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake

      # 注:原来这里有一项「JDK 8,只编译不打包」的矩阵项,用来拦住「误用
      # Java 9+ 新 API」—— 因为 targetCompatibility=1.8 只约束字节码版本,
      # 并不检查 API 是否存在于 JDK 8。Gradle 9.3.1 无法运行在 JDK 8 上,
      # 因此该项已移除。如需恢复这种静态检查,正确做法是在 build.gradle 里
      # 改用 `options.release = 8`(javac `--release 8` 会对照 Java 8 的 API
      # 签名),这样在 JDK 17+ 上也能生效,不需要装 JDK 8。
      - name: Build (shadowJar)
        run: ./gradlew :obfuscator:shadowJar --console=plain

      - name: Smoke test (--version)
        run: |
          set -euo pipefail
          JAR=$(ls obfuscator/build/libs/*.jar | head -n 1)
          echo "Built: $JAR"
          java -jar "$JAR" --version
